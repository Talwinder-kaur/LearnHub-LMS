<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub - Student Account</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eaf1ff;
    }

    header {
        background: #173b70;
        color: white;
        text-align: center;
        padding: 20px;
    }

    .container {
        max-width: 420px;
        margin: 35px auto;
        padding: 25px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px #00000018;
    }

    h2 {
        text-align: center;
        color: #2456a6;
    }

    input {
        width: 100%;
        padding: 13px;
        margin: 9px 0;
        border: 1px solid #bbb;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 12px;
        background: #2456a6;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
    }

    .switch {
        text-align: center;
        margin-top: 20px;
    }

    .switch a {
        color: #2456a6;
        font-weight: bold;
    }

    .message {
        text-align: center;
        padding: 10px;
        overflow-wrap: anywhere;
    }

    .back {
        text-align: center;
        margin: 20px;
    }

    .back a {
        color: #2456a6;
    }
</style>

</head><body><header>
    <h1>LearnHub</h1>
    <p>Student Account</p>
</header><div class="container" id="registerBox">
    <h2>Create Account</h2><form id="registerForm">
    <input type="text" id="name"
           placeholder="Full Name" required>

    <input type="email" id="email"
           placeholder="Email Address" required>

    <input type="password" id="password"
           placeholder="Create Password"
           minlength="6" required>

    <button type="submit">Register</button>
</form>

<p class="switch">
    Already registered?
    <a href="#" id="showLogin">Login</a>
</p>

</div><div class="container" id="loginBox" hidden>
    <h2>Student Login</h2><form id="loginForm">
    <input type="email" id="loginEmail"
           placeholder="Email Address" required>

    <input type="password" id="loginPassword"
           placeholder="Password" required>

    <button type="submit">Login</button>
</form>

<p class="switch">
    New student?
    <a href="#" id="showRegister">Create Account</a>
</p>

</div><p class="message" id="message" role="status"></p><div class="back">
    <a href="index.html">← Back to Home</a>
</div><script>
    const registerBox = document.getElementById("registerBox");
    const loginBox = document.getElementById("loginBox");
    const message = document.getElementById("message");

    document.getElementById("showLogin").onclick = function(event) {
        event.preventDefault();
        registerBox.hidden = true;
        loginBox.hidden = false;
        message.textContent = "";
    };

    document.getElementById("showRegister").onclick = function(event) {
        event.preventDefault();
        loginBox.hidden = true;
        registerBox.hidden = false;
        message.textContent = "";
    };

    document.getElementById("registerForm").onsubmit = function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();

        message.style.color = "green";
        message.textContent =
            "Registration demo completed for " + name +
            ". Account details are not saved.";

        this.reset();
    };

    document.getElementById("loginForm").onsubmit = function(event) {
        event.preventDefault();

        message.style.color = "#2456a6";
        message.textContent =
            "Demo login form is working. Real account verification is not connected.";
    };
</script></body>
</html>
