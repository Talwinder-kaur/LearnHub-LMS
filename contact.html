<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | LearnHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8ff;
            color: #243247;
            line-height: 1.6;
        }

        header {
            background: #0d47a1;
            color: white;
            text-align: center;
            padding: 24px 15px;
        }

        nav {
            background: white;
            padding: 14px 8px;
            text-align: center;
        }

        nav a {
            display: inline-block;
            color: #0d47a1;
            text-decoration: none;
            font-weight: bold;
            margin: 5px 8px;
        }

        nav a:hover {
            color: #42a5f5;
        }

        .hero {
            text-align: center;
            background: #e3efff;
            padding: 35px 15px;
        }

        .hero h2 {
            color: #0d47a1;
            margin-bottom: 8px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .contact-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }

        .contact-box h3 {
            color: #0d47a1;
            margin-bottom: 18px;
            text-align: center;
        }

        label {
            display: block;
            margin: 14px 0 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus, textarea:focus {
            outline: 2px solid #90caf9;
            border-color: #1565c0;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        #message {
            margin-top: 15px;
            color: #16803d;
            text-align: center;
            font-weight: bold;
        }

        footer {
            margin-top: 35px;
            padding: 18px;
            text-align: center;
            background: #0d47a1;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>LearnHub</h1>
        <p>Learn Today, Lead Tomorrow</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
        <a href="Login.html">Login / Register</a>
    </nav>

    <section class="hero">
        <h2>Contact Us</h2>
        <p>Have a question? We would love to hear from you!</p>
    </section>

    <main class="container">
        <section class="contact-box">
            <h3>Send Us a Message</h3>

            <form id="contactForm">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="userMessage">Your Message</label>
                <textarea
                    id="userMessage"
                    placeholder="Write your message here"
                    required
                ></textarea>

                <button type="submit">Send Message</button>

                <p id="message" role="status"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 LearnHub | Learning Management System</p>
    </footer>

    <script>
        document.getElementById("contactForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                document.getElementById("message").textContent =
                    "Thank you! Your demo message has been submitted.";

                this.reset();
            }
        );
    </script>

</body>
</html>
