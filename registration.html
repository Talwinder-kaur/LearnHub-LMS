<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LearnHub</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0b1f3a, #1769aa);
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .logo {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        color: #1769aa;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    h2 {
        text-align: center;
        color: #0b1f3a;
        margin-bottom: 22px;
    }

    label {
        display: block;
        margin: 14px 0 7px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #1769aa;
    }

    button {
        width: 100%;
        margin-top: 22px;
        padding: 13px;
        background: #1769aa;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #0b1f3a;
    }

    .message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
    }

    .login-link {
        text-align: center;
        margin-top: 20px;
        color: #555;
        font-size: 14px;
    }

    a {
        color: #1769aa;
        font-weight: bold;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
    }
</style>

</head><body><div class="container">

    <div class="logo">LearnHub</div>
    <p class="subtitle">Start your learning journey today!</p>

    <h2>Create Account</h2>

    <form id="registrationForm">

        <label for="fullName">Full Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            minlength="6"
            required
        >

        <button type="submit">Register Now</button>

        <p class="message" id="message" role="status"></p>

    </form>

    <p class="login-link">
        Already have an account?
        <a href="Login.html">Login Here</a>
    </p>

    <a class="back-link" href="index.html">← Back to Home</a>

</div>

<script>
    const form = document.getElementById("registrationForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            message.style.color = "red";
            message.textContent = "Passwords do not match!";
            return;
        }

        let users = JSON.parse(
            localStorage.getItem("learnhubUsers") || "[]"
        );

        const existingUser = users.find(function(user) {
            return user.email === email;
        });

        if (existingUser) {
            message.style.color = "red";
            message.textContent = "This email is already registered.";
            return;
        }

        users.push({
            name: name,
            email: email,
            password: password
        });

        localStorage.setItem("learnhubUsers", JSON.stringify(users));

        message.style.color = "green";
        message.textContent = "Registration successful! Redirecting to login...";

        form.reset();

        setTimeout(function() {
            window.location.href = "Login.html";
        }, 1500);
    });
</script>

</body>
</html>
